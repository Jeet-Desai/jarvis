[package]
name = "jarvis"
version = "0.1.0"
description = "Jarvis — your personal voice agent"
authors = ["jeet"]
edition = "2021"

[lib]
name = "jarvis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
cpal = "0.16"
hound = "3.5"
dotenvy = "0.15"
# native-tls → macOS SecureTransport → system keychain.
# (The previous rustls-tls used bundled webpki roots only.)
reqwest = { version = "0.12", features = ["json", "native-tls", "blocking"], default-features = false }
whisper-rs = { version = "0.14", features = ["metal"] }
rubato = "0.16"
libc = "0.2"
# webrtc-vad: classical voice-activity detector ported from Chrome's WebRTC.
# Replaces the old RMS-threshold VAD which was unreliable in noisy rooms
# (couldn't distinguish quiet speech from ambient, leading to stuck-in-
# listening 30 s timeouts). Pure C wrapped via FFI, ~50 KB binary cost.
webrtc-vad = "0.4"
# Already a transitive dep — pulling to root so the hallucination guard in
# brain/ollama.rs can build precompiled patterns instead of string-matching.
regex = "1"
base64 = "0.22"
# MCP client — talks to external tool servers (e.g. @cocal/google-calendar-mcp)
# over stdio. Optional at runtime — only spawns if user configures credentials.
# (tokio already declared above with "full" features — covers what rmcp needs.)
rmcp = { version = "0.8", features = ["client", "transport-child-process"] }
# enigo: cross-platform synthetic mouse/keyboard input (macOS CGEvent, Windows
# SendInput, Linux X11). The single anchor that makes JARVIS 2.0's computer
# control portable. On macOS it posts CGEvents — needs the Accessibility TCC
# grant, the same bucket permissions.rs already requests via AXIsProcessTrusted.
enigo = "0.6"
# toml: parse the human-editable safety policy (policy.toml). Tiny, pure Rust.
toml = "0.8"

[target."cfg(target_os = \"macos\")".dependencies]
cocoa = "0.26"
objc = "0.2"
# Accessibility (AXUIElement) FFI for reading the focused app's UI tree —
# roles, labels, on-screen coordinates — so Jarvis can understand and click
# native UI. We hand-declare the few AX functions we need (matching the FFI
# style already in permissions.rs) and use core-foundation for safe
# CFString/CFArray RAII + the Create-rule CFRelease discipline. Same
# Accessibility TCC grant as enigo, already requested at startup.
core-foundation = "0.10"
core-foundation-sys = "0.8"
# NSPanel conversion for reliable fullscreen overlay (the cocoa NSWindow
# approach with level 1000 + fullScreenAuxiliary works for most fullscreen
# apps but is unreliable on Sonoma/Sequoia/Tahoe with browser/video full-
# screen. NSPanel-class windows bypass the regular Space-restriction policy.)
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
